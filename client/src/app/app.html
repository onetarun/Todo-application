<a class="skip-link" href="#main">Skip to content</a>

<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/lists">
    <mat-icon aria-hidden="true">checklist</mat-icon>
    <span>Todo</span>
  </a>

  @if (auth.currentUser(); as user) {
    <nav class="nav" aria-label="Main">
      <a mat-button routerLink="/lists" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Lists</a
      >
      <a mat-button routerLink="/tags" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Tags</a
      >
    </nav>
    <span class="spacer"></span>
    <span class="user-name">{{ user.name }}</span>
    <button mat-button type="button" (click)="signOut()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      Sign out
    </button>
  }
</mat-toolbar>

<main id="main" class="content" tabindex="-1">
  <router-outlet />
</main>
