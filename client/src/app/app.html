<a class="skip-link" href="#main">Skip to content</a>

<mat-toolbar class="toolbar">
  <a class="brand" routerLink="/lists">
    <mat-icon aria-hidden="true">checklist</mat-icon>
    <span>Todo</span>
  </a>

  @if (auth.currentUser(); as user) {
    <!-- Wide screens: inline navigation. -->
    <nav class="nav wide-only" aria-label="Main">
      <a mat-button routerLink="/lists" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Lists</a
      >
      <a mat-button routerLink="/tags" routerLinkActive="active" ariaCurrentWhenActive="page"
        >Tags</a
      >
    </nav>
    <span class="spacer"></span>
    <span class="user-name wide-only">{{ user.name }}</span>
    <button mat-button type="button" class="wide-only" (click)="signOut()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      Sign out
    </button>

    <!-- Narrow screens: the same actions in a menu. -->
    <button
      mat-icon-button
      type="button"
      class="narrow-only"
      [matMenuTriggerFor]="mainMenu"
      aria-label="Open menu"
    >
      <mat-icon aria-hidden="true">menu</mat-icon>
    </button>
    <mat-menu #mainMenu="matMenu" xPosition="before">
      <div class="menu-user" aria-hidden="true">{{ user.name }}</div>
      <a mat-menu-item routerLink="/lists">
        <mat-icon aria-hidden="true">list</mat-icon>
        <span>Lists</span>
      </a>
      <a mat-menu-item routerLink="/tags">
        <mat-icon aria-hidden="true">sell</mat-icon>
        <span>Tags</span>
      </a>
      <button mat-menu-item type="button" (click)="signOut()">
        <mat-icon aria-hidden="true">logout</mat-icon>
        <span>Sign out</span>
      </button>
    </mat-menu>
  }
</mat-toolbar>

<main id="main" class="content" tabindex="-1">
  <router-outlet />
</main>
